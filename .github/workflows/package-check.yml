name: Daily Package check
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      parallel:
        description: "Most jobs of this run at once (the org shares 20 runner slots)"
        type: string
        default: "4"

# One run at a time; a second one waits rather than doubling the load on the runners and GHCR.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  meta:
    name: Ingest Metadata
    # A fork runs the nightly check on its own. Where something else dispatches it with a computed `parallel`
    # (LinuxServer's control plane), the repository variable SCHEDULED_BY_CONTROL=true turns the cron off.
    if: github.event_name != 'schedule' || vars.SCHEDULED_BY_CONTROL != 'true'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-meta.outputs.matrix }}
      parallel: ${{ steps.set-meta.outputs.parallel }}
    steps:
      - uses: actions/checkout@v5
      - id: set-meta
        env:
          PARALLEL: ${{ inputs.parallel || '4' }}
        run: |
          # max-parallel: a whole number from 1 to 16, else the default 4
          if [[ "${PARALLEL}" =~ ^[0-9]+$ ]] && (( PARALLEL >= 1 && PARALLEL <= 16 )); then
            echo "parallel=${PARALLEL}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::parallel '${PARALLEL}' is not a number from 1 to 16; using 4"
            echo "parallel=4" >> "$GITHUB_OUTPUT"
          fi
          # Disabled apps are not built, so their packages are not checked either
          # (filtered in jq: yq compares the YAML `True` the file uses as a string, not as the boolean)
          echo "matrix=$(yq -o=j -I=0 '.include' metadata/metadata.yml | jq -c '{include: [.[] | select(.disabled != true)]}')" >> "$GITHUB_OUTPUT"
  # Apps build FROM the base tags, so refresh those first: the check then sees the packages users would get.
  base:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs: meta
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash ci-scripts/build-base.sh "${NAME}"
        env:
          NAME: ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.meta.outputs.parallel) }}
      matrix:
        include:
          - name: alpine-323
          - name: alpine-324
          - name: alpine-edge
          - name: debian-trixie
          - name: ubuntu-jammy
          - name: ubuntu-noble
          - name: ubuntu-resolute
  # One pass per app: build and scan amd64, and only when its packages changed, push every arch. No second run.
  pupdate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs:
      - meta
      - base
    if: always() && needs.meta.result == 'success' && needs.base.result != 'cancelled'
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash ci-scripts/build-app.sh "${NAME}" "${PLATFORMS}" check
        env:
          NAME: ${{ matrix.name }}
          PLATFORMS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: ignore
          path: apps/${{ matrix.name }}/package_versions.txt
          retention-days: 1
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.meta.outputs.parallel) }}
      matrix: ${{ fromJson(needs.meta.outputs.matrix) }}
  pcommit:
    name: Commit package versions
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.meta.result == 'success' }}
    needs:
      - meta
      - pupdate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - run: bash ci-scripts/commit-packages.sh
