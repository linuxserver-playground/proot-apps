name: build-on-commit
# The title says what the run builds. "build changed" runs are the ones that track changes: the next one builds
# what changed since the last of them that finished, so a push whose run was superseded while pending is not lost.
run-name: build ${{ inputs.build_all && 'all' || inputs.apps || 'changed' }}

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      build_all:
        description: "Build and push all apps"
        type: boolean
        default: false
      apps:
        description: "Space-separated apps to build (empty: what changed since the last build)"
        type: string
        default: ""
      parallel:
        description: "Most jobs of this run at once (the org shares 20 runner slots)"
        type: string
        default: "4"

# One run at a time; a newer push or dispatch waits instead of cancelling a build halfway.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  meta:
    name: Ingest Metadata
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-meta.outputs.matrix }}
      count: ${{ steps.set-meta.outputs.count }}
      base: ${{ steps.set-meta.outputs.base }}
      parallel: ${{ steps.set-meta.outputs.parallel }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: set-meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ALL: ${{ inputs.build_all || false }}
          APPS: ${{ inputs.apps || '' }}
          PARALLEL: ${{ inputs.parallel || '4' }}
          BEFORE: ${{ github.event.before || '' }}
        run: |
          source ci-scripts/lib.sh
          # max-parallel for both matrices: a whole number from 1 to 16, else the default 4
          if [[ "${PARALLEL}" =~ ^[0-9]+$ ]] && (( PARALLEL >= 1 && PARALLEL <= 16 )); then
            echo "parallel=${PARALLEL}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::parallel '${PARALLEL}' is not a number from 1 to 16; using 4"
            echo "parallel=4" >> "$GITHUB_OUTPUT"
          fi
          base=false
          if [[ "${BUILD_ALL}" == "true" ]]; then
            filter='[.[] | select(.disabled != true)]'
            base=true
          elif [[ -n "${APPS}" ]]; then
            names=$(jq -cn --arg a "${APPS}" '$a | split(" ") | map(select(. != ""))')
            # shellcheck disable=SC2016 # $names is a jq variable
            filter='[.[] | select(.name | IN($names[]))]'
          else
            # What changed since the last finished "build changed" run, or since the push's parent
            since=$(retry 3 10 gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-on-commit.yml/runs?branch=master&per_page=50" \
              --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .display_title == \"build changed\" and (.conclusion == \"success\" or .conclusion == \"failure\"))][0].head_sha // empty")
            if [[ -z "${since}" ]] || ! git merge-base --is-ancestor "${since}" HEAD 2>/dev/null; then
              since="${BEFORE}"
            fi
            if [[ -z "${since}" || "${since}" =~ ^0+$ ]] || ! git cat-file -e "${since}^{commit}" 2>/dev/null; then
              since=$(git rev-parse HEAD~1)
            fi
            echo "Changes since ${since}"
            names=$(git diff --name-only "${since}" HEAD -- apps/ | cut -d/ -f2 | sort -u | jq -R . | jq -cs .)
            # shellcheck disable=SC2016 # $names is a jq variable
            filter='[.[] | select(.name | IN($names[]))]'
            if [[ -n "$(git diff --name-only "${since}" HEAD -- base-images/)" ]]; then
              base=true
            fi
          fi
          matrix=$(yq -o=j -I=0 '.include' metadata/metadata.yml | jq -c --argjson names "${names:-[]}" "${filter}")
          count=$(jq length <<< "${matrix}")
          # Apps build FROM the base tags, so refresh those first whenever an app builds
          (( count > 0 )) && base=true
          echo "Building ${count} apps (base images: ${base}): $(jq -r 'map(.name) | join(" ")' <<< "${matrix}")"
          {
            echo "matrix={\"include\":${matrix}}"
            echo "count=${count}"
            echo "base=${base}"
          } >> "$GITHUB_OUTPUT"
  base:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs: meta
    if: needs.meta.outputs.base == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          NAME: ${{ matrix.name }}
        run: |
          source ci-scripts/lib.sh
          cd base-images
          retry_ghcr docker buildx build --push \
            --file "Dockerfile.${NAME}" \
            --platform linux/amd64,linux/arm64 \
            --build-arg "REPO=${GITHUB_REPOSITORY,,}" \
            --tag "ghcr.io/${GITHUB_REPOSITORY,,}:${NAME}" .
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.meta.outputs.parallel) }}
      matrix:
        include:
          - name: alpine-323
          - name: alpine-324
          - name: alpine-edge
          - name: debian-trixie
          - name: ubuntu-jammy
          - name: ubuntu-noble
          - name: ubuntu-resolute
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs:
      - base
      - meta
    if: always() && needs.meta.result == 'success' && needs.meta.outputs.count != '0' && needs.base.result != 'cancelled'
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          NAME: ${{ matrix.name }}
          PLATFORMS: ${{ matrix.arch }}
        run: |
          source ci-scripts/lib.sh
          cd "apps/${NAME}/"
          retry_ghcr docker buildx build --push \
            --platform "${PLATFORMS}" \
            --build-arg "REPO=${GITHUB_REPOSITORY,,}" \
            --tag "ghcr.io/${GITHUB_REPOSITORY,,}:${NAME}" .
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.meta.outputs.parallel) }}
      matrix: ${{ fromJson(needs.meta.outputs.matrix) }}
