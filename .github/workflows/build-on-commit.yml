name: build-on-commit
# The title says what the run builds. "build changed" runs are the ones that track changes: the next one builds
# what changed since the last of them that finished, so a push whose run was superseded while pending is not lost.
run-name: build ${{ inputs.build_all && 'all' || inputs.apps || 'changed' }}

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      build_all:
        description: "Build and push all apps"
        type: boolean
        default: false
      apps:
        description: "Space-separated apps to build (empty: what changed since the last build)"
        type: string
        default: ""
      parallel:
        description: "Most jobs of this run at once (the org shares 20 runner slots)"
        type: string
        default: "4"

# One run at a time; a newer push or dispatch waits instead of cancelling a build halfway.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  meta:
    name: Ingest Metadata
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-meta.outputs.matrix }}
      count: ${{ steps.set-meta.outputs.count }}
      base: ${{ steps.set-meta.outputs.base }}
      bases: ${{ steps.set-meta.outputs.bases }}
      parallel: ${{ steps.set-meta.outputs.parallel }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: set-meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_ALL: ${{ inputs.build_all || false }}
          APPS: ${{ inputs.apps || '' }}
          PARALLEL: ${{ inputs.parallel || '4' }}
          BEFORE: ${{ github.event.before || '' }}
        run: |
          source ci-scripts/lib.sh
          # max-parallel for both matrices: a whole number from 1 to 16, else the default 4
          if [[ "${PARALLEL}" =~ ^[0-9]+$ ]] && (( PARALLEL >= 1 && PARALLEL <= 16 )); then
            echo "parallel=${PARALLEL}" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::parallel '${PARALLEL}' is not a number from 1 to 16; using 4"
            echo "parallel=4" >> "$GITHUB_OUTPUT"
          fi
          # The base images this workflow builds; the daily package check refreshes the same set every night
          all_bases='["alpine-323","alpine-324","alpine-edge","debian-trixie","ubuntu-jammy","ubuntu-noble","ubuntu-resolute"]'
          bases='[]'
          if [[ "${BUILD_ALL}" == "true" ]]; then
            filter='[.[] | select(.disabled != true)]'
            bases="${all_bases}"
          elif [[ -n "${APPS}" ]]; then
            names=$(jq -cn --arg a "${APPS}" '$a | split(" ") | map(select(. != ""))')
            # shellcheck disable=SC2016 # $names is a jq variable
            filter='[.[] | select(.name | IN($names[]))]'
          else
            # What changed since the last finished "build changed" run, or since the push's parent
            since=$(retry 3 10 gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-on-commit.yml/runs?branch=master&per_page=50" \
              --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .display_title == \"build changed\" and (.conclusion == \"success\" or .conclusion == \"failure\"))][0].head_sha // empty")
            if [[ -z "${since}" ]] || ! git merge-base --is-ancestor "${since}" HEAD 2>/dev/null; then
              since="${BEFORE}"
            fi
            if [[ -z "${since}" || "${since}" =~ ^0+$ ]] || ! git cat-file -e "${since}^{commit}" 2>/dev/null; then
              since=$(git rev-parse HEAD~1)
            fi
            echo "Changes since ${since}"
            # package_versions.txt is written by the builds themselves (Package Bot), never a reason to build
            names=$(git diff --name-only "${since}" HEAD -- apps/ ':(exclude)apps/*/package_versions.txt' \
              | cut -d/ -f2 | sort -u | jq -R . | jq -cs .)
            # shellcheck disable=SC2016 # $names is a jq variable
            filter='[.[] | select(.name | IN($names[]))]'
            # A changed base Dockerfile rebuilds that base; any other change under base-images/ rebuilds them all
            changed=$(git diff --name-only "${since}" HEAD -- base-images/)
            if [[ -n "${changed}" ]] && grep -qv '^base-images/Dockerfile\.' <<< "${changed}"; then
              bases="${all_bases}"
            elif [[ -n "${changed}" ]]; then
              bases=$(jq -R . <<< "${changed//base-images\/Dockerfile./}" | jq -cs .)
            fi
          fi
          matrix=$(yq -o=j -I=0 '.include' metadata/metadata.yml | jq -c --argjson names "${names:-[]}" "${filter}")
          count=$(jq length <<< "${matrix}")
          # Apps build FROM the base tags, so refresh the ones the apps being built use (their FROM lines) first
          for app in $(jq -r '.[].name' <<< "${matrix}"); do
            # shellcheck disable=SC2016 # ${REPO} is the Dockerfile's own ARG, matched literally
            used=$(sed -n 's|^FROM ghcr.io/${REPO}:\([a-z0-9-]*\).*|\1|p' "apps/${app}/Dockerfile" | jq -R . | jq -cs .)
            bases=$(jq -cn --argjson a "${bases}" --argjson b "${used}" '$a + $b | unique')
          done
          bases=$(jq -cn --argjson a "${bases}" --argjson all "${all_bases}" '[$a[] | select(IN($all[]))]')
          base=$([[ "${bases}" == "[]" ]] && echo false || echo true)
          echo "Building ${count} apps: $(jq -r 'map(.name) | join(" ")' <<< "${matrix}")"
          echo "Base images: $(jq -r 'join(" ")' <<< "${bases}")"
          {
            echo "matrix={\"include\":${matrix}}"
            echo "count=${count}"
            echo "base=${base}"
            echo "bases=${bases}"
          } >> "$GITHUB_OUTPUT"
  base:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs: meta
    if: needs.meta.outputs.base == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash ci-scripts/build-base.sh "${NAME}"
        env:
          NAME: ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.meta.outputs.parallel) }}
      matrix:
        name: ${{ fromJson(needs.meta.outputs.bases) }}
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs:
      - base
      - meta
    if: always() && needs.meta.result == 'success' && needs.meta.outputs.count != '0' && needs.base.result != 'cancelled'
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Build, scan and push in one pass; the package list it records is committed below, with no second run.
      - run: bash ci-scripts/build-app.sh "${NAME}" "${PLATFORMS}" push
        env:
          NAME: ${{ matrix.name }}
          PLATFORMS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: ignore
          path: apps/${{ matrix.name }}/package_versions.txt
          retention-days: 1
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.meta.outputs.parallel) }}
      matrix: ${{ fromJson(needs.meta.outputs.matrix) }}
  pcommit:
    name: Commit package versions
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.meta.result == 'success' && needs.meta.outputs.count != '0' }}
    needs:
      - meta
      - build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - run: bash ci-scripts/commit-packages.sh
